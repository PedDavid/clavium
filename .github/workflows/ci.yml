name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: CRD is up to date
        run: |
          cargo run --quiet --locked --bin crdgen > /tmp/apikeys.yaml
          diff -u deploy/crds/apikeys.yaml /tmp/apikeys.yaml
          diff -u deploy/crds/apikeys.yaml deploy/helm/clavium/crds/apikeys.yaml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - working-directory: e2e
        env:
          CLAVIUM_BIN: ${{ github.workspace }}/target/debug/clavium
        run: npx playwright test
  openbao:
    runs-on: ubuntu-latest
    services:
      openbao:
        image: openbao/openbao:2.4.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: root
        ports: ["8200:8200"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - name: Write-only policy against a real OpenBao
        env:
          CLAVIUM_TEST_OPENBAO_ADDR: http://127.0.0.1:8200
          CLAVIUM_TEST_OPENBAO_ROOT_TOKEN: root
        run: cargo test --locked --test openbao

  css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSS is up to date
        run: |
          curl -sSfL -o /usr/local/bin/tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64
          chmod +x /usr/local/bin/tailwindcss
          make css
          git diff --exit-code assets/dist/app.css

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
