{% if !rows.is_empty() %}
<div role="group" aria-labelledby="command-keys">
  <span role="presentation" class="command-heading" id="command-keys">{% if q.is_empty() %}Most urgent{% else %}Keys{% endif %}</span>
  {% for row in rows %}
  <a role="option" id="command-option-{{ loop.index }}" href="/keys/{{ row.name }}" aria-selected="{% if loop.first %}true{% else %}false{% endif %}"{% if loop.first %} class="active"{% endif %}>
    <span class="state-dot" data-state="{{ row.state_str() }}"></span>
    <span class="truncate">{{ row.display_name }}</span>
    <span class="ms-auto" data-shortcut>{{ row.state_label() }} · {% if row.on_demand %}used {{ row.last_used_rel }}{% else %}{{ row.deadline_rel }}{% endif %}</span>
  </a>
  {% endfor %}
</div>
{% endif %}
