# A key that never expires on its own: the deadline comes from maxAge only.
apiVersion: clavium.prdv.cloud/v1alpha1
kind: ApiKey
metadata:
  name: openai-homeassistant
  namespace: clavium
spec:
  displayName: OpenAI – Home Assistant
  owner: david
  renewUrl: https://platform.openai.com/api-keys
  setup:
    permissions: ["project: home-assistant", "models: read", "responses: write"]
  rotation:
    maxAge: 180d
    warnBefore: 30d
  targets:
    - openbao:
        mount: secret
        path: home/home-assistant
        key: openai_api_key
