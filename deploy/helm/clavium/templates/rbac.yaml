# Access to ApiKeys and their status only. No access to Secrets: keys are
# written to OpenBao, never to Kubernetes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "clavium.fullname" . }}
  namespace: {{ include "clavium.apiKeysNamespace" . }}
  labels:
    {{- include "clavium.labels" . | nindent 4 }}
rules:
  - apiGroups: ["clavium.prdv.cloud"]
    resources: ["apikeys"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["clavium.prdv.cloud"]
    resources: ["apikeys/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "clavium.fullname" . }}
  namespace: {{ include "clavium.apiKeysNamespace" . }}
  labels:
    {{- include "clavium.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "clavium.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "clavium.fullname" . }}
    namespace: {{ .Release.Namespace }}
