{{- if .Values.grafanaDashboard.enabled }}
# Picked up by the Grafana dashboard sidecar (e.g. kube-prometheus-stack).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clavium.fullname" . }}-dashboard
  namespace: {{ default .Release.Namespace .Values.grafanaDashboard.namespace }}
  labels:
    {{- include "clavium.labels" . | nindent 4 }}
    {{- toYaml .Values.grafanaDashboard.labels | nindent 4 }}
data:
  clavium.json: |-
{{ .Files.Get "files/dashboard.json" | indent 4 }}
{{- end }}
