{{- if .Values.prometheusRule.enabled }}
{{- $url := trimSuffix "/" .Values.publicUrl }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "clavium.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clavium.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: clavium
      rules:
{{ (tpl (.Files.Get "files/alerts.yaml") (dict "url" $url "alertLabels" .Values.prometheusRule.alertLabels "Template" .Template)) | indent 8 }}
{{- end }}
